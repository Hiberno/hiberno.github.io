<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hiberno's Games Site Hub</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Courier New", monospace;
      color: #00ffcc;
      background: linear-gradient(#0a001a, #25003e, #56008a, #25003e, #0a001a);
      background-size: 100% 300%;
      animation: bgMove 12s ease infinite;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes bgMove {
      0% { background-position: 0% 0%; }
      50% { background-position: 0% 100%; }
      100% { background-position: 0% 0%; }
    }

    /* CRT Scanline Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 2px,
        rgba(0, 0, 0, 0.1) 2px,
        rgba(0, 0, 0, 0.1) 4px
      );
      z-index: 10;
    }

    h1 {
      margin-top: 40px;
      font-size: 48px;
      text-shadow: 0 0 8px #ff00aa, 0 0 16px #ff00aa;
      color: #ff66dd;
      text-align: center;
    }

    .container {
      margin-top: 40px;
      width: 90%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      position: relative;
      z-index: 5;
    }

    .card {
      border: 2px solid #ff66dd;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(3px);
      box-shadow: 0 0 10px #ff0099;
    }

    .card:hover {
      background: rgba(50, 0, 70, 0.6);
      transform: scale(1.07);
      box-shadow: 0 0 20px #ff33cc;
    }

    a {
      color: #ff99ee;
      font-size: 20px;
      text-decoration: none;
      font-weight: bold;
      text-shadow: 0 0 6px #ff33cc;
    }
  </style>
</head>
<body>
  <h1>HIBERNO'S GAMES SITE HUB</h1>

  <div class="container">
    <div class="card">
      <a href="https://hiberno.github.io/Emulatrix/" target="_blank">Emulatrix</a>
    </div>

    <div class="card">
      <a href="https://hiberno.github.io/cbf-failsafe/" target="_blank">CBF Failsafe</a>
    </div>

    <div class="card">
      <a href="https://hiberno.github.io/gamehub/" target="_blank">Gamehub</a>
    </div>

    <div class="card">
      <a href="https://hiberno.github.io/Hibernos-Calculus-Tutor/" target="_blank">Calculus Tutor</a>
    </div>
  </div>
  <!-- CRT Boot Screen -->
  <div id="bootScreen">
    <div id="macFrame">
      <div id="macTitle">Hiberno System // Macintosh IIx</div>
      <div id="logWindow">
        <pre id="logText"></pre>
      </div>
    </div>
  </div>

  <style>
    /* --- Old Macintosh Boot Shell --- */
    #bootScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #c6c6c6;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: "Chicago", "Courier New", monospace;
    }

    #macFrame {
      background: #e1e1e1;
      width: 80%;
      max-width: 700px;
      padding: 20px;
      border: 4px solid black;
      box-shadow: 0 0 0 8px #8c8c8c;
    }

    #macTitle {
      background: black;
      color: white;
      padding: 10px;
      font-size: 20px;
      text-align: center;
      margin-bottom: 10px;
    }

    #logWindow {
      background: white;
      height: 300px;
      overflow: hidden;
      border: 2px solid black;
      padding: 10px;
    }

    #logText {
      font-size: 14px;
      line-height: 18px;
      color: black;
      white-space: pre-line;
    }
  </style>

  <script>
    const logs = [
      "Welcome to Macintosh...",
      "Initializing Hiberno OS 1.3...",
      "Checking RAM........  OK",
      "Loading QuickDraw........  OK",
      "Mounting Disk ‘NEON_DRIVE’........  OK",
      "Starting Finder Extensions........  OK",
      "Loading Retro Graphics Engine........  OK",
      "Starting Neon Pipeline........  OK",
      "Boot complete."
    ];

    let index = 0;

    function addNextLog() {
      if (index < logs.length) {
        document.getElementById("logText").innerText += logs[index] + "\n";
        index++;
        setTimeout(addNextLog, 600);
      } else {
        setTimeout(() => {
          document.getElementById("bootScreen").style.transition = "opacity 1s";
          document.getElementById("bootScreen").style.opacity = "0";
          setTimeout(() => document.getElementById("bootScreen").remove(), 1200);
        }, 1200);
      }
    }

    setTimeout(addNextLog, 500);
  </script>

</body>
</html>
