<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiberno's Games Site Hub</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Courier New", monospace;
    color: #00ffcc;
    background: linear-gradient(#0a001a, #25003e, #56008a, #25003e, #0a001a);
    background-size: 100% 300%;
    animation: bgMove 12s ease infinite;
    overflow: hidden;
  }

  @keyframes bgMove {
    0% { background-position: 0% 0%; }
    50% { background-position: 0% 100%; }
    100% { background-position: 0% 0%; }
  }

  /* CRT Scanlines */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.15) 0px,
      rgba(0, 0, 0, 0.15) 2px,
      rgba(0, 0, 0, 0.1) 2px,
      rgba(0, 0, 0, 0.1) 4px
    );
    z-index: 10;
  }

  h1 {
    margin-top: 40px;
    font-size: 48px;
    text-shadow: 0 0 8px #ff00aa;
    color: #ff66dd;
    text-align: center;
  }

  .container {
    margin: 40px auto;
    width: 90%;
    max-width: 900px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    z-index: 5;
    position: relative;
  }

  .card {
    border: 2px solid #ff66dd;
    padding: 20px;
    text-align: center;
    background: rgba(0, 0, 0, 0.4);
    box-shadow: 0 0 10px #ff0099;
    backdrop-filter: blur(3px);
  }

  .card:hover {
    background: rgba(50, 0, 70, 0.6);
    transform: scale(1.07);
    box-shadow: 0 0 20px #ff33cc;
  }

  a {
    color: #ff99ee;
    font-size: 20px;
    text-decoration: none;
    font-weight: bold;
  }

  /* ---------------------- */
  /* RETRO TERMINAL MENU    */
  /* ---------------------- */
  #terminalMenu {
    position: fixed;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    max-width: 90%;
    background: black;
    border: 3px solid #00ffcc;
    box-shadow: 0 0 20px #00ffaa;
    padding: 20px;
    z-index: 99999;
    display: none;
    animation: flicker 0.15s infinite alternate;
  }

  @keyframes flicker {
    from { opacity: 0.97; }
    to   { opacity: 1; }
  }

  #terminalMenu h2 {
    color: #00ffcc;
    text-shadow: 0 0 8px #00ffee;
    margin-bottom: 10px;
    font-size: 26px;
  }

  .menu-option {
    font-size: 20px;
    padding: 5px 0;
    color: #00ffaa;
  }

  .selected {
    background: #00ffaa;
    color: black;
    padding-left: 10px;
  }

</style>
</head>

<body>

<h1>HIBERNO'S GAMES SITE HUB</h1>

<div class="container">
  <div class="card"><a href="https://hiberno.github.io/Emulatrix/" target="_blank">Emulatrix</a></div>
  <div class="card"><a href="https://hiberno.github.io/cbf-failsafe/" target="_blank">CBF Failsafe</a></div>
  <div class="card"><a href="https://hiberno.github.io/gamehub/" target="_blank">Gamehub</a></div>
  <div class="card"><a href="https://hiberno.github.io/Hibernos-Calculus-Tutor/" target="_blank">Calculus Tutor</a></div>
</div>

<!-- RETRO TERMINAL MENU -->
<div id="terminalMenu">
  <h2>== Hiberno Terminal Menu ==</h2>

  <div id="opt0" class="menu-option selected">Emulatrix</div>
  <div id="opt1" class="menu-option">CBF Failsafe</div>
  <div id="opt2" class="menu-option">Gamehub</div>
  <div id="opt3" class="menu-option">Calculus Tutor</div>

  <p style="color:#00ffcc;margin-top:15px;font-size:14px;">
    ↑/↓ to navigate · ENTER to open · ESC to hide
  </p>
</div>


<script>
/* -----------------------------
   TERMINAL MENU KEYBOARD LOGIC
--------------------------------*/

const links = [
  "https://hiberno.github.io/Emulatrix/",
  "https://hiberno.github.io/cbf-failsafe/",
  "https://hiberno.github.io/gamehub/",
  "https://hiberno.github.io/Hibernos-Calculus-Tutor/"
];

let selected = 0;
let menuOpen = true;

const menu = document.getElementById("terminalMenu");
const options = document.getElementsByClassName("menu-option");

menu.style.display = "block"; // Show menu on load

function updateSelection() {
  for (let i = 0; i < options.length; i++) {
    options[i].classList.toggle("selected", i === selected);
  }
}

document.addEventListener("keydown", (e) => {
  if (!menuOpen) return;

  if (e.key === "ArrowDown") {
    selected = (selected + 1) % options.length;
    updateSelection();
  }

  if (e.key === "ArrowUp") {
    selected = (selected - 1 + options.length) % options.length;
    updateSelection();
  }

  if (e.key === "Enter") {
    window.open(links[selected], "_blank");
  }

  if (e.key === "Escape") {
    menuOpen = false;
    menu.style.display = "none";
  }
});
</script>

</body>
</html>
